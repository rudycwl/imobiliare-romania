# Verifică din afară, la 15 minute, că cheiamea.ro răspunde. Dacă tot serverul Oracle cade (și paza de pe el odată cu el),
# rularea eșuează, iar GitHub trimite un email proprietarului repo-ului.
name: Veghe cheiamea.ro
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pagina de start răspunde
        run: curl -fsS -o /dev/null -m 30 --retry 3 --retry-delay 20 --retry-all-errors https://cheiamea.ro/
